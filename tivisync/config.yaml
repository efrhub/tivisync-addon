name: TiviSync
version: "1.16.3"
slug: tivisync
url: https://github.com/efrhub/tivisync-addon
description: Sync server + parental controls for the TiviSync Android TV IPTV app
arch: [amd64, aarch64, armv7]
startup: application
boot: auto
init: false
ingress: true
homeassistant_api: true
ingress_port: 8080
ingress_entry: parent/
panel_icon: mdi:television-classic
panel_title: TiviSync
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "TiviSync API for the TVs on your home network"
options:
  admin_password: ""
  tz: Europe/London
  ha_webhook_url: "http://homeassistant:8123/api/webhook/tivisync_CHANGE_ME"
  api_token: ""
  ntfy_url: ""
  public_url: ""
  github_token: ""
  github_repo: "efrhub/tivisync"
  tmdb_api_key: ""
  chart_region: GB
  remote_url: ""
  doorbell_entity: binary_sensor.doorbell_visitor
  notify_services:
    - mobile_app_home_47
    - mobile_app_pixel_10_pro_xl
schema:
  admin_password: password?
