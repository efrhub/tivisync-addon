<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Family Planner</title>
<meta name="theme-color" content="#1F3A7A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Planner">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stripe" aria-hidden="true"></div>
<header><div class="wrap">
  <span class="brand">Family Planner</span>
  <div class="pills mode-switch" id="mode-switch" role="group" aria-label="Working as" hidden><button class="pill" data-a="mode-set" data-id="admin">Admin</button><button class="pill" data-a="mode-set" data-id="cleaner">Cleaner</button></div>
  <nav aria-label="Views" id="nav" hidden><div class="tabs" id="tabs">
    <a href="#today" data-tab="today"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Today</a>
    <a href="#week" data-tab="week"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</a>
    <a href="#rooms" data-tab="rooms"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 9.5V21h14V9.5M10 21v-6h4v6"/></svg>Rooms</a>
    <a href="#progress" data-tab="progress"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21v-7M12 21V4M19 21V10"/></svg>Progress</a>
    <a href="#school" data-tab="school"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Schedule</a>
    <a href="#extra" data-tab="extra" hidden><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="7" width="19" height="11" rx="5"/><path d="M8 10.5v4M6 12.5h4M15.5 11.5h.01M18 13.5h.01"/></svg>Extra time</a>
    <a href="#chat" data-tab="chat" hidden><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6 4V6a2 2 0 0 1 2-2z"/></svg>Chat<span id="chat-badge" class="tab-badge" hidden></span></a>
    <a href="#shop" data-tab="shop" hidden><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.5 12h11l2-8H6"/><circle cx="9.5" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg>Shopping</a>
    <a href="#logs" data-tab="logs" hidden><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Logs</a>
    <a href="#system" data-tab="system" hidden><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>System</a>
  </div></nav>
  <button class="btn primary" data-a="new" id="add-btn" hidden>Add chore</button>
</div></header>
<main class="wrap" id="main"><div class="empty">Loading your planner…</div></main>
<footer class="site-foot wrap"><button class="link" id="whats-new" data-a="whats-new" hidden>What's new</button><span>Created by David Baglietto. &copy; 2026 the Baglietto family.</span></footer>
<dialog id="sheet" aria-labelledby="sheet-title"></dialog>
<div id="toast" hidden role="status"></div>
<script src="app.js"></script>
</body>
</html>
